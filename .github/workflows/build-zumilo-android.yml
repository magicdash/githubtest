name: Build ZUMILO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'android-template/**'
      - '.github/workflows/build-zumilo-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Apply ZUMILO native Android integration
        run: cp android-template/MainActivity.java android/app/src/main/java/com/zumilo/finanzas/MainActivity.java
      - name: Apply ZUMILO Finanzas IA launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir=$1
            size=$2
            mkdir -p android/app/src/main/res/$dir
            rsvg-convert -w $size -h $size android-template/zumilo-icon.svg -o android/app/src/main/res/$dir/ic_launcher.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Re-apply launcher icon after Capacitor sync
        run: |
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir=$1
            size=$2
            rsvg-convert -w $size -h $size android-template/zumilo-icon.svg -o android/app/src/main/res/$dir/ic_launcher.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZUMILO-Finanzas-IA-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUMILO-Finanzas-IA-Android
          path: ZUMILO-Finanzas-IA-Android.apk
          retention-days: 30
      - name: Publish stable APK download
        run: |
          mkdir -p downloads
          cp ZUMILO-Finanzas-IA-Android.apk downloads/ZUMILO-Finanzas-IA-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ZUMILO-Finanzas-IA-Android.apk
          git commit -m "Publish latest ZUMILO Android APK" || exit 0
          git push
