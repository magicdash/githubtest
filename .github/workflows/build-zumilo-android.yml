name: Build ZUMILO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - '.github/workflows/build-zumilo-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZUMILO-Finanzas-IA-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUMILO-Finanzas-IA-Android
          path: ZUMILO-Finanzas-IA-Android.apk
          retention-days: 30
